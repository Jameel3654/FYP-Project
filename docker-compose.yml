# ==============================================================================
# Docker Compose Configuration for COF-RAG System
# Context Optimization Framework for Document-Based RAG Systems
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Frontend Client Service (React / Vite)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: cof_rag_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    env_file:
      - ./apps/client/.env
    depends_on:
      - server
    networks:
      - cof_rag_network

  # ----------------------------------------------------------------------------
  # Backend Server Service (Node.js / Express API Gateway)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: cof_rag_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/cof_rag
      - AI_ENGINE_URL=http://ai_engine:8000
    env_file:
      - ./apps/server/.env
    volumes:
      - upload_data:/app/uploads
    depends_on:
      - mongodb
      - ai_engine
    networks:
      - cof_rag_network

  # ----------------------------------------------------------------------------
  # AI Engine Service (Python / FastAPI / LLMLingua / Embeddings / OCR)
  # ----------------------------------------------------------------------------
  ai_engine:
    build:
      context: ./apps/ai_engine
      dockerfile: Dockerfile
    container_name: cof_rag_ai_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/data/uploads
    env_file:
      - ./apps/ai_engine/.env
    volumes:
      - upload_data:/app/data/uploads
    networks:
      - cof_rag_network

  # ----------------------------------------------------------------------------
  # MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: cof_rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - cof_rag_network

# ------------------------------------------------------------------------------
# Volumes & Networks Definitions
# ------------------------------------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  upload_data:
    driver: local

networks:
  cof_rag_network:
    driver: bridge
